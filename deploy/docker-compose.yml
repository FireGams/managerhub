services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: managerhub
      POSTGRES_PASSWORD: managerhub
      POSTGRES_DB: managerhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U managerhub"]
      interval: 5s
      timeout: 3s
      retries: 5

  controller:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.controller
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MH_HTTP_ADDR: ":8080"
      MH_PUBLIC_URL: "http://localhost:8080"
      MH_DATABASE_URL: "postgres://managerhub:managerhub@postgres:5432/managerhub?sslmode=disable"
      MH_JWT_SECRET: "${MH_JWT_SECRET:-dev-secret-change-me-now}"
      MH_ENROLL_TOKEN_TTL: "24h"
      MH_METRICS_RETENTION: "168h"
      MH_JOBLOG_RETENTION: "720h"
    ports:
      - "8080:8080"

volumes:
  pgdata:
